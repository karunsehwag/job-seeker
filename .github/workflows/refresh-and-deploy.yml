name: Refresh jobs and deploy to Pages

on:
  schedule:
    # Once a day. JSearch's free tier is ~200 requests/month and this uses 5
    # per run, so daily keeps us at ~150/month with headroom for manual runs.
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Fetch live job listings
        run: node backend/fetchAll.js
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/jobs.json
          git diff --cached --quiet || git commit -m "Auto-refresh job listings"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
